name: Lint - Ortflix Costume

on:
  workflow_call:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}

jobs:
  sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check sync shell syntax
        run: |
          bash -n scripts/sync_to_host.sh
          bash -n scripts/tests/sync_to_host_test.sh
      - name: Verify sync previews do not mutate remote state
        run: bash scripts/tests/sync_to_host_test.sh

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run ruff checks
        run: |
          ruff check .
          ruff format --check .
